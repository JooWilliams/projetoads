<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <title>Acessar Conta</title>
    
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3a0ca3;
            --accent-color: #4895ef;
            --light-color: #f8f9fa;
            --dark-color: #212529;
            --success-color: #4cc9f0;
            --warning-color: #f8961e;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 40px;
            width: 100%;
            max-width: 450px;
            transition: all 0.3s ease;
        }
        
        .login-title {
            color: var(--dark-color);
            font-weight: 800;
            margin-bottom: 25px;
            text-align: center;
            position: relative;
        }
        
        .btn-login {
            background-color: var(--secondary-color);
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 500;
            transition: all 0.3s;
            color: white;
            width: 100%;
        }
        
        .btn-login:hover {
            background-color: var(--success-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(190, 190, 190, 0.1);
        }
        .btn-secondary-action:hover {
            background-color: #f0f0f0;
            transform: translateY(-2px);
        }
        
        .form-group {
            margin-bottom: 10px;
        }

        .login-options{
            margin-top: 20;
            font-size: 13;
        }
        
        .login-options a:hover {
            text-decoration: underline;
        }

        #username::placeholder{
            opacity: 0.4;
        }
        #password::placeholder{
            opacity: 0.4;
        }
        </style>
</head>
<body>
    <div class="login-container">
        <h2 class="login-title">Acessar sua conta</h2>
        
        <form id="login-form" th:object="${usuario}" action="login" method="post">
            <div class="alert alert-danger" role="alert" th:if="${param.error}">
                <i class="fas fa-exclamation-circle me-2"></i>Credenciais inválidas, tente novamente!
            </div>
            
            <div class="form-group">
                <label for="username" class="form-label">Usuário</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" class="form-control" name="username" id="username" th:field="*{username}" placeholder="Digite seu usuário" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="password" class="form-label">Senha</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control" name="password" id="password" th:field="*{password}" placeholder="Digite sua senha" required>
                </div>
            </div>
            
            <div class="form-group">
                <button type="submit" class="btn btn-login">
                    <i></i>Acessar
                </button>
            </div>
            
            <div class="login-options">
                <div class="d-flex justify-content-between">
                    <a th:href="@{/usuario/recuperarSenha}">
                        <i></i>Esqueci minha senha
                    </a>
                    <a th:href="@{/usuario/inserir}">
                        <i></i>Criar conta
                    </a>
                </div>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
