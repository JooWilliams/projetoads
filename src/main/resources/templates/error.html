<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <title>Erro - Gestão Escolar</title>

    <style>
        :root {
            --dark-color: #212529;
            --warning-color: #f8961e;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 3rem;
            text-align: center;
            max-width: 600px;
            width: 100%;
            margin: 2rem auto;
        }

        .error-icon {
            font-size: 10rem;
            color: #e63946;
            margin-bottom: 1.5rem;
        }

        .error-code {
            font-size: 3rem;
            font-weight: 600;
            color: var(--warning-color);
            margin-bottom: 1rem;
        }

        .error-title {
            color: var(--dark-color);
            font-weight: 600;
            margin-bottom: 1rem;
            font-size: 1.8rem;
        }

        .error-message {
            color: #6c757d;
            margin-bottom: 2rem;
            font-size: 1.1rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">
            <i class="fas fa-exclamation-triangle"></i>
        </div>

        <div class="error-code" th:text="${status} ?: '404'">404</div>

        <h1 class="error-title">Oops! Algo deu errado</h1>

        <p class="error-message">
            <span th:if="${status == 404}">A página que você está procurando não foi encontrada.</span>
            <span th:if="${status == 500}">Ocorreu um erro interno no servidor.</span>
            <span th:if="${status == 403}">Você não tem permissão para acessar este recurso.</span>
            <span th:unless="${status == 404 or status == 500 or status == 403}">
                Desculpe, ocorreu um erro inesperado em nosso sistema.
            </span>
        </p>
    </div>
</body>
</html>
